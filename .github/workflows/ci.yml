name: Test and package
on:
  pull_request:
  push:
    branches: [main]
    tags: ['0.*', '1.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run deploy -- --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-engine
          path: |
            artifacts/main.js
            artifacts/manifest.json
            artifacts/styles.css
            artifacts/semantic-engine-*.zip
            artifacts/SHA256SUMS.txt
  release:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: semantic-engine
          path: artifacts
      - name: Check tag and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG="$(node -p "require('./artifacts/manifest.json').version")"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" artifacts/main.js artifacts/manifest.json artifacts/styles.css artifacts/semantic-engine-*.zip artifacts/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Semantic Engine $RELEASE_TAG" --generate-notes
